name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.9" 
          channels: conda-forge
          activate-environment: occ-build          

      - name: Install dependencies
        run: |
          conda install -y numpy scipy pyvista PySide2 pyinstaller

      - name: Build executable
        run: |
          # 1. Get conda env root path
          $envPath = conda run -n occ-build python -c "import sys; print(sys.prefix)"
          
          # 2. Create missing QtWebEngine locale dir (satisfies PyInstaller's path check)
          mkdir -Force "$envPath\Library\share\qt6\translations\qtwebengine_locales"
          
          # 3. Build with WebEngine excluded (saves ~80MB & avoids Chromium bundling)
          conda run -n occ-build pyinstaller --clean --onedir --windowed `
            --name MyApp `
            --collect-all PySide2 `
            --collect-all vtk `
            --exclude-module PySide2.QtWebEngineCore `
            --exclude-module PySide2.QtWebEngineWidgets `
            gui.py
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable
          path: dist/MyApp
          if-no-files-found: error
